name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v3

      - name: SSH 키 설정
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > private_key.pem
          chmod 600 private_key.pem

      - name: EC2에 코드 배포
        run: |
          ssh -o StrictHostKeyChecking=no -i private_key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -e

            # 프로젝트 디렉토리로 이동
            cd ~/discord-bot || { echo "프로젝트 디렉토리가 없습니다. 클론을 시도합니다."; git clone https://github.com/your-repo-url.git ~/discord-bot && cd ~/discord-bot; }

            # 원격 저장소와의 연결 확인
            if ! git remote show origin > /dev/null 2>&1; then
              echo "원격 저장소 'origin'이 설정되지 않았습니다."
              exit 1
            fi

            # 최신 코드 가져오기
            git pull origin main

            # nvm 환경 로드
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            # Node.js 및 npm 설치 확인
            if ! command -v node > /dev/null 2>&1; then
              echo "Node.js가 설치되지 않았습니다. 설치를 진행합니다."
              curl -fsSL https://deb.nodesource.com/setup_16.x | sudo -E bash -
              sudo apt-get install -y nodejs
            fi

            # Node.js 및 npm 버전 확인
            node -v
            npm -v

            # 패키지 설치
            npm install

            # .env 파일 생성
            cat <<EOT > .env
            NODE_ENV=production
            MONGO_URL=${{ secrets.MONGO_URL }}
            DISCORD_TOKEN=${{ secrets.DISCORD_TOKEN }}
            CLIENT_ID=${{ secrets.CLIENT_ID }}
            GUILD_ID=${{ secrets.GUILD_ID }}
            PUBG_API_KEY=${{ secrets.PUBG_API_KEY }}
            PUBG_HOST=${{ secrets.PUBG_HOST }}
            EOT

            # pm2 환경 로드 및 애플리케이션 재시작
            if ! command -v pm2 > /dev/null 2>&1; then
              echo "PM2가 설치되지 않았습니다. 설치를 진행합니다."
              npm install -g pm2
            fi

            pm2 reload ecosystem.config.js --env production || pm2 start ecosystem.config.js --env production
          EOF
